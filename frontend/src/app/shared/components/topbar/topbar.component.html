<header class="h-full px-4 md:px-6 lg:px-8 flex items-center justify-between">
  <!-- Search / Global Action Area -->
  <div class="flex-1 flex items-center">
    <div class="relative w-full max-w-md hidden md:block">
      <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
        <svg class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
      </div>
      <input type="text" class="block w-full pl-10 pr-3 py-2 border border-gray-200 rounded-lg leading-5 bg-gray-50 placeholder-gray-400 focus:outline-none focus:bg-white focus:ring-2 focus:ring-primary-500 focus:border-primary-500 sm:text-sm transition-all" placeholder="Search companies, drives, or candidates...">
      <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
        <span class="text-gray-400 sm:text-sm font-semibold border border-gray-200 rounded px-1.5 py-0.5 bg-white">⌘K</span>
      </div>
    </div>
  </div>

  <!-- Right Side Actions -->
  <div class="ml-4 flex items-center space-x-4 md:space-x-6">
    
    <!-- Notification Bell -->
    <app-notifications-dropdown></app-notifications-dropdown>

    <!-- Profile Dropdown -->
    <div class="relative flex items-center space-x-3 cursor-pointer group" *ngIf="user$ | async as user">
      <div class="text-right hidden sm:block">
        <div class="text-sm font-bold text-gray-900 leading-none">{{ user.full_name }}</div>
        <div class="text-[11px] font-semibold text-primary-600 mt-1 uppercase tracking-wider">{{ user.role }}</div>
      </div>
      <div class="h-10 w-10 rounded-full bg-gradient-to-tr from-primary-600 to-indigo-500 text-white flex items-center justify-center font-bold shadow-sm ring-2 ring-white overflow-hidden relative">
        <span>{{ user.full_name.charAt(0) }}</span>
        <!-- Active indicator -->
        <span class="absolute bottom-0 right-0 block h-2.5 w-2.5 rounded-full bg-green-400 ring-2 ring-white"></span>
      </div>
      <button (click)="logout()" class="ml-2 text-xs text-gray-500 hover:text-red-600 font-semibold p-1 hover:bg-red-50 rounded">Logout</button>
    </div>
  </div>
</header>
