<div class="relative">
  <button (click)="toggleDropdown()" class="relative p-2 text-gray-400 hover:text-gray-500 focus:outline-none transition-colors rounded-full hover:bg-gray-100">
    <span class="sr-only">View notifications</span>
    <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
    </svg>
    
    <span *ngIf="unreadCount > 0" class="absolute top-1 right-1 block h-2.5 w-2.5 rounded-full bg-red-500 ring-2 ring-white"></span>
  </button>

  <div *ngIf="isOpen" class="origin-top-right absolute right-0 mt-2 w-80 rounded-xl shadow-lg bg-white ring-1 ring-black ring-opacity-5 divide-y divide-gray-100 focus:outline-none z-50">
    <div class="px-4 py-3 flex justify-between items-center">
      <p class="text-sm font-bold text-gray-900">Notifications</p>
      <span *ngIf="unreadCount > 0" class="bg-primary-100 text-primary-800 text-xs font-semibold px-2.5 py-0.5 rounded-full">{{ unreadCount }} new</span>
    </div>
    
    <div class="max-h-96 overflow-y-auto">
      <div *ngIf="notifications.length === 0" class="px-4 py-6 text-center text-sm text-gray-500">
        You have no notifications.
      </div>
      
      <a *ngFor="let n of notifications" [href]="n.action_url ? n.action_url : '#'" class="block px-4 py-3 hover:bg-gray-50 transition duration-150 ease-in-out" [ngClass]="{'bg-blue-50/30': !n.is_read}">
        <div class="flex justify-between items-start">
          <p class="text-sm font-semibold" [ngClass]="n.is_read ? 'text-gray-700' : 'text-gray-900'">{{ n.title }}</p>
          <span class="text-xs text-gray-400 whitespace-nowrap">{{ n.created_at | date:'short' }}</span>
        </div>
        <p class="mt-1 text-sm text-gray-500">{{ n.message }}</p>
      </a>
    </div>
    
    <a href="#" class="block px-4 py-2 text-sm text-center text-primary-600 font-medium hover:bg-gray-50 rounded-b-xl">
      View all notifications
    </a>
  </div>
</div>
