<div class="min-h-screen flex items-center justify-center bg-slate-50 py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full space-y-8 bg-white p-8 rounded-xl shadow-card border border-gray-100">
    <div>
      <div class="flex justify-center text-primary-600">
        <svg class="w-12 h-12" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
      </div>
      <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">Sign in to PlacePulse</h2>
      <p class="mt-2 text-center text-sm text-gray-600">
        Smart Campus Placement Platform
      </p>
    </div>
    
    <!-- Added reactive form handling in the template -->
    <form class="mt-8 space-y-6" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="rounded-md shadow-sm -space-y-px">
        <div>
          <label for="email-address" class="sr-only">Email address</label>
          <input id="email-address" type="email" formControlName="email" required class="appearance-none rounded-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-t-md focus:outline-none focus:ring-primary-500 focus:border-primary-500 focus:z-10 sm:text-sm" placeholder="Email address">
        </div>
        <div>
          <label for="password" class="sr-only">Password</label>
          <input id="password" type="password" formControlName="password" required class="appearance-none rounded-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-b-md focus:outline-none focus:ring-primary-500 focus:border-primary-500 focus:z-10 sm:text-sm" placeholder="Password">
        </div>
      </div>

      <div *ngIf="errorMessage" class="text-red-500 text-sm text-center font-medium bg-red-50 py-2 rounded">
        {{ errorMessage }}
      </div>

      <div *ngIf="successMessage" class="text-green-600 text-sm text-center font-medium bg-green-50 py-2 rounded border border-green-200">
        {{ successMessage }}
      </div>

      <div>
        <button type="submit" [disabled]="loginForm.invalid || isLoading" class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-primary-600 hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500 disabled:opacity-70 disabled:cursor-not-allowed transition-colors shadow-sm">
          <span class="absolute left-0 inset-y-0 flex items-center pl-3">
            <svg class="h-5 w-5 text-primary-500 group-hover:text-primary-400" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd" /></svg>
          </span>
          {{ isLoading ? 'Signing in...' : 'Sign in' }}
        </button>
      </div>
      
      <div class="text-sm text-center mt-4">
        <span class="text-gray-600">Don't have an account?</span>
        <a routerLink="/register" class="font-medium text-primary-600 hover:text-primary-500 ml-1">Register here</a>
      </div>
      
      <div class="mt-4 text-xs text-gray-500 space-y-1 text-center border-t border-gray-100 pt-4">
        <p>Test accounts:</p>
        <p>Admin: admin&#64;college.edu / admin123</p>
        <p>Student: 21cse1084&#64;college.edu / student123</p>
        <p>Recruiter: recruiter&#64;microsoft.com / recruiter123</p>
      </div>
    </form>
  </div>
</div>
