<div class="max-w-6xl mx-auto space-y-6">
  <div class="flex items-center justify-between">
    <div>
      <h1 class="text-2xl font-bold text-gray-900">Offer Management</h1>
      <p class="text-sm text-gray-500">Roll out offers to selected candidates</p>
    </div>
    <button *ngIf="!showOfferForm" (click)="showOfferForm = true" class="btn-primary flex items-center space-x-2">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
      <span>Roll out Offer</span>
    </button>
  </div>

  <div *ngIf="errorMessage" class="bg-red-50 text-red-700 p-3 rounded text-sm">
    {{ errorMessage }}
  </div>
  <div *ngIf="successMessage" class="bg-green-50 text-green-700 p-3 rounded text-sm">
    {{ successMessage }}
  </div>

  <!-- Offer Form -->
  <div *ngIf="showOfferForm" class="card p-6 border border-gray-200">
    <h3 class="text-lg font-semibold text-gray-900 mb-4 border-b border-gray-100 pb-2">Roll Out Offer</h3>
    <form [formGroup]="offerForm" (ngSubmit)="onSubmit()" class="space-y-6">
      
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label class="block text-sm font-medium text-gray-700">Candidate</label>
          <select formControlName="application_id" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-primary-500 focus:border-primary-500 sm:text-sm">
            <option value="">-- Select Candidate --</option>
            <option *ngFor="let app of applications" [value]="app.id">
              {{ app.student_name }} ({{ app.roll_number }}) - {{ app.job_title }} [{{ app.status }}]
            </option>
          </select>
        </div>
        
        <div>
          <label class="block text-sm font-medium text-gray-700">Final CTC Offered (in LPA)</label>
          <input type="number" step="0.1" formControlName="ctc_offered" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-primary-500 focus:border-primary-500 sm:text-sm">
        </div>
      </div>

      <div class="flex justify-end space-x-3 border-t border-gray-100 pt-4">
        <button type="button" (click)="showOfferForm = false" class="px-4 py-2 border border-gray-300 shadow-sm text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50 focus:outline-none">
          Cancel
        </button>
        <button type="submit" [disabled]="offerForm.invalid || isSaving" class="btn-primary flex items-center bg-green-600 hover:bg-green-700 text-white">
          <svg *ngIf="isSaving" class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle></svg>
          {{ isSaving ? 'Processing...' : 'Confirm Offer' }}
        </button>
      </div>
    </form>
  </div>

  <div *ngIf="!isLoading" class="bg-white shadow-sm rounded-xl border border-gray-200 overflow-hidden mt-6">
    <div class="px-6 py-4 border-b border-gray-200 bg-gray-50 flex justify-between items-center">
      <h3 class="text-sm font-bold text-gray-700 uppercase tracking-wider">Offered Candidates</h3>
    </div>
    <table class="min-w-full divide-y divide-gray-200">
      <thead class="bg-gray-50">
        <tr>
          <th scope="col" class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Candidate</th>
          <th scope="col" class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Role</th>
          <th scope="col" class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">CTC</th>
        </tr>
      </thead>
      <tbody class="bg-white divide-y divide-gray-200">
        <!-- Filter to only show OFFERED candidates -->
        <ng-container *ngFor="let app of applications">
          <tr *ngIf="app.status === 'OFFERED'" class="hover:bg-gray-50 transition-colors">
            <td class="px-6 py-4 whitespace-nowrap">
              <div class="text-sm font-bold text-gray-900">{{ app.student_name }}</div>
              <div class="text-xs text-gray-500">{{ app.roll_number }} • {{ app.branch }}</div>
            </td>
            <td class="px-6 py-4 whitespace-nowrap">
              <div class="text-sm text-gray-900">{{ app.job_title }}</div>
            </td>
            <td class="px-6 py-4 whitespace-nowrap">
              <span class="px-2 py-1 text-xs font-bold rounded-md bg-green-100 text-green-800">
                OFFERED
              </span>
            </td>
          </tr>
        </ng-container>
      </tbody>
    </table>
  </div>
</div>
